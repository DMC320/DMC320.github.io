<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Sistemas de Votación</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Simulador del Teorema de Arrow</h1>
    </header>

    <main>
        <section id="configuracion">
            <h2>1. Configuración</h2>
            <input type="text" id="candidatos" placeholder="Ingresa candidatos (ej. A, B, C)">
            <button onclick="iniciarSimulacion()">Iniciar Sistema</button>
        </section>

        <section id="output">
            <h2>Resultados</h2>
            <div id="display-resultados"></div>
        </section>
    </main>

    <footer>
        <p>Simulador desarrollado por <strong>Mtro. Daniel Moreno Cortés</strong></p>
        <p>Innovación Jurídica Educativa | Agosto 2026</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
